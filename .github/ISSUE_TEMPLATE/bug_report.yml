name: Сообщить об ошибке / Bug Report
description: Сообщить о проблеме в работе Clavis
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Версия Clavis
      placeholder: "например: v1.1.0 Beta"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Версия Windows
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Кратко опишите ошибку и шаги для её воспроизведения. Не прикладывайте пароли, приватные ключи или реальные IP-адреса.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: false
