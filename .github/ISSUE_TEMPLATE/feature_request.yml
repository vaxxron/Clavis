name: Предложить идею / Feature Request
description: Предложить новую функцию или улучшение интерфейса
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: В чём идея?
      description: Опишите, какую задачу должна решать функция и как вы её видите.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст / сценарий использования
    validations:
      required: false
